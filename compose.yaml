name: footprint

services:
  db:
    # postgis/postgis has no arm64 build; imresamu/postgis is the multi-arch build the PostGIS README points at.
    image: imresamu/postgis:18-3.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # The image installs PostGIS into POSTGRES_DB at init, which Prisma Migrate sees as drift.
      # Keep that on the default db and create the app database plain in db-init.sql.
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18+ keeps data under /var/lib/postgresql/<major>/docker, so mount the parent.
      - db-data:/var/lib/postgresql
      # Runs once on first init. Creates the app database.
      - ./scripts/db-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data:
