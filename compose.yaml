name: footprint

services:
  db:
    # postgis/postgis has no arm64 build; imresamu/postgis is the multi-arch build the PostGIS README points at.
    image: imresamu/postgis:18-3.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Not `app`: the image adds extensions here that Prisma sees as drift. Prisma creates `app`.
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18+ keeps data under /var/lib/postgresql/<major>/docker, so mount the parent.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data:
